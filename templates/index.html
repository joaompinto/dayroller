<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="calendar-container">
            <div class="calendar-body">
                <div class="calendar-grid">
                    <div class="table-header">
                        <div class="header-cell date-header" aria-label="Date Header">
                            <button id="headerYearButton"></button>
                            <div id="headerMonths" class="header-months">
                                <!-- Dynamic content for months will be inserted here by JavaScript -->
                            </div>
                        </div>
                        <div class="header-cell plan-header" aria-label="Plan Header">
                            <div id="planHeaderControls" class="plan-header-controls">
                                <!-- Dynamic content will be inserted here by JavaScript -->
                            </div>
                        </div>
                    </div>
                    <div class="table-body">
                        <table>
                            <tbody id="calendarBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Year/Month Picker -->
    <div id="yearMonthModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Select Year and Month</h2>
            <select id="yearPicker"></select>
            <select id="monthPicker">
                <option value="0">Jan</option>
                <option value="1">Feb</option>
                <option value="2">Mar</option>
                <option value="3">Apr</option>
                <option value="4">May</option>
                <option value="5">Jun</option>
                <option value="6">Jul</option>
                <option value="7">Aug</option>
                <option value="8">Sep</option>
                <option value="9">Oct</option>
                <option value="10">Nov</option>
                <option value="11">Dec</option>
            </select>
            <button id="applyYearMonth">Apply</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='calendarCore.js') }}"></script>
    <script src="{{ url_for('static', filename='eventHandlers.js') }}"></script>
</body>
</html>
